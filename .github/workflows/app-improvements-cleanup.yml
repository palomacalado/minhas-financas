name: Apply app improvements cleanup
on:
  push:
    branches: [feature/melhorias-horizonte-setembro]
    paths: [scripts/cleanup-app-improvements.py]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/melhorias-horizonte-setembro
      - run: python scripts/cleanup-app-improvements.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "feat: remove import UI and Burgeria special treatment"
          git push
