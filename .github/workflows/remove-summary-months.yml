name: Remove summary month selector
on:
  push:
    branches: [feature/melhorias-horizonte-setembro]
    paths: [scripts/remove-summary-months.py]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/melhorias-horizonte-setembro
      - run: python scripts/remove-summary-months.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "ui: show month selector only in Horizon"
          git push
